name: CI

on:
  push:
  pull_request:

jobs:
  backend-static-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest tests/test_security_hardening.py tests/test_settings_drift.py tests/test_credential_remediation.py tests/test_migrations_runner.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false
        env:
          CI: "true"
      - run: yarn build
        env:
          CI: "true"

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked clone junk (DESKTOP clones, SQLite dbs)
        run: |
          bad=$(git ls-files | grep -E -e '-DESKTOP-' -e '\.db$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked files matching *-DESKTOP-* or *.db are forbidden (clone junk):"
            echo "$bad"
            exit 1
          fi

  dependency-audit:
    # TASK-260 — pip-audit over the pinned backend requirements.
    # Non-blocking first (continue-on-error); flip to blocking after triage.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
