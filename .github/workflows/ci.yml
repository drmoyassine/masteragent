name: CI

on:
  push:
  pull_request:

jobs:
  backend-static-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # TASK-261 — full suite, hermetic by default: testcontainers Postgres
      # (pgvector) + Redis boot inside the job; the live_pipeline marker
      # (LLM-provider e2e) stays excluded via pytest.ini addopts.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false
        env:
          CI: "true"
      - run: yarn build
        env:
          CI: "true"

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked clone junk (DESKTOP clones, SQLite dbs)
        run: |
          bad=$(git ls-files | grep -E -e '-DESKTOP-' -e '\.db$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked files matching *-DESKTOP-* or *.db are forbidden (clone junk):"
            echo "$bad"
            exit 1
          fi

  dependency-audit:
    # TASK-260 — pip-audit over the pinned backend requirements.
    # Blocking since 2026-10-17 (owner-approved flip after triage; the
    # continue-on-error comment from the initial landing is retired).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
